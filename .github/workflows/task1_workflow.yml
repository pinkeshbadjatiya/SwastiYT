name: Download Video Workflow

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'  # Runs every hour

jobs:
  download_video_job:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Check for Pending Download Video Task
        run: |
          # Read pending.json
          pending_json=$(cat tasks/pending.json)
          
          # Iterate over each video in pending.json
          for video_id in $(echo "$pending_json" | jq -r 'keys[]'); do
            download_video_status=$(echo "$pending_json" | jq -r ".$video_id.download_video")
            
            if [ "$download_video_status" = "pending" ]; then
              # Perform Download Video logic here
              echo "Performing Download Video for $video_id"
              
              # Update download_video status to completed
              echo "$pending_json" | jq ".$video_id.download_video = \"completed\"" > tasks/pending.json
              
              echo "Updated download_video status for $video_id to completed"
            fi
          done