name: YT Video Download [Zapier,Issue,Cron]

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  download_on_runner:
    if: startsWith(github.event.issue.title, 'Process')
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Venv and Install Tools
        run: |
          if [ ! -d "venv" ]; then
            python3 -m venv venv
          fi
          ./venv/bin/pip install --upgrade pip
          ./venv/bin/pip install yt-dlp

      - name: Parse and Download
        # We use a Heredoc (cat << 'EOF') here.
        # This safely copies the issue body to a file without 'echo' trying to interpret special characters.
        run: |
          cat << 'EOF' > issue_data.txt
          ${{ github.event.issue.body }}
          EOF
          
          echo "Running download script..."
          ./venv/bin/python src/download_video.py issue_data.txt

      - name: Commit and Push Video & Metadata
        run: |
          git config user.name "Self-Hosted Runner"
          git config user.email "runner@local"
          
          # Create folders if missing to prevent git errors
          mkdir -p videos metadata
          
          git add videos/ metadata/
          
          # Check if there are changes before committing to avoid empty commit errors
          if git diff-index --quiet HEAD; then
            echo "No changes to commit"
          else
            git commit -m "Add video & metadata from Issue #${{ github.event.issue.number }}"
            git push
          fi

      # ---------------------------------------------------------
      # RELEASE STEPS (Zapier Trigger & 'Published' Signal)
      # ---------------------------------------------------------
      
      - name: Read Metadata for Release
        if: success()
        run: |
          # Read ID and Title from the files generated by your python script
          # xargs is used here to trim whitespace
          VIDEO_ID=$(cat video_id.txt | xargs)
          echo "VIDEO_ID=$VIDEO_ID" >> $GITHUB_ENV
          
          VIDEO_TITLE=$(cat video_title.txt | xargs)
          echo "VIDEO_TITLE=$VIDEO_TITLE" >> $GITHUB_ENV

      - name: Create Release
        # This creates the "tag" that your UI looks for to mark a video as PUBLISHED
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          ## VIDEO ID: Accessible in Zapier as "Tag Name"
          tag_name: ${{ env.VIDEO_ID }}

          ## VIDEO TITLE: Accessible in Zapier as "Name" (Added for you)
          name: ${{ env.VIDEO_TITLE }}
          files: videos/${{ env.VIDEO_ID }}.mp4

          ## VIDEO DESCRIPTION: Accessible in Zapier as "Body"
          body_path: release_body.txt

      # ---------------------------------------------------------
      # STATUS HANDLING (Issue Updates)
      # ---------------------------------------------------------

      - name: Handle Success
        if: success()
        uses: actions/github-script@v6
        with:
          script: |
            const originalTitle = context.payload.issue.title;
            const newTitle = originalTitle.includes("Success") ? originalTitle : `${originalTitle} - Success`;
            
            // Rename issue and close it
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              title: newTitle,
              state: 'closed',
              state_reason: 'completed'
            });
            
            // Add success comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ **Success!** Video downloaded and Release created for distribution.'
            });

      - name: Handle Failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            const originalTitle = context.payload.issue.title;
            const newTitle = originalTitle.includes("Failed") ? originalTitle : `${originalTitle} - Failed`;
            
            // Rename issue to indicate failure (keeps it open for debugging)
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              title: newTitle
            });
