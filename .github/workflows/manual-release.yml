name: "Task: Release Video from Metadata"

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: 'Enter the Video ID (e.g., PGETFB5dJCY)'
        required: true
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  release:
    # Trigger if manually run OR if issue title contains 'Release'
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.title, 'Release')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Fetch Metadata and Create Release
        env:
          # Get ID from manual input OR from the issue body
          INPUT_ID: ${{ github.event.inputs.video_id || github.event.issue.body }}
        run: |
          # Clean the input (remove whitespace/newlines)
          VIDEO_ID=$(echo "$INPUT_ID" | xargs)
          python3 .github/scripts/generate_release.py "$VIDEO_ID"
