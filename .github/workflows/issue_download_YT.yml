name: Download Video from Issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  download_on_runner:
    if: startsWith(github.event.issue.title, 'Download ')
    runs-on: self-hosted
    environment: secure-runner
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 1. Setup Virtual Environment (No sudo needed)
      - name: Setup Venv and Install Tools
        run: |
          if [ ! -d "venv" ]; then
            python3 -m venv venv
          fi
          ./venv/bin/pip install --upgrade pip
          ./venv/bin/pip install yt-dlp

      # 2. Run the Download Script
      - name: Validate and Download
        id: download_step
        run: |
          ISSUE_TITLE="${{ github.event.issue.title }}"
          VIDEO_ID=$(echo "${ISSUE_TITLE#"Download "}" | xargs)
          
          # Security Check
          if [[ ! "$VIDEO_ID" =~ ^[a-zA-Z0-9_-]{11}$ ]]; then
            echo "::error::Security Alert: Invalid Video ID format: $VIDEO_ID"
            exit 1
          fi
          
          VIDEO_URL="https://www.youtube.com/watch?v=${VIDEO_ID}"
          echo "Security Check Passed. Downloading: $VIDEO_ID"
          
          # Run using venv python
          ./venv/bin/python download_video.py "$VIDEO_URL"

      # 3. Commit and Push
      - name: Commit and Push Video
        run: |
          git config user.name "Self-Hosted Runner"
          git config user.email "runner@local"
          
          git add videos/
          
          if git diff-index --quiet HEAD; then
            echo "No changes to commit"
          else
            git commit -m "Add video from Issue #${{ github.event.issue.number }}"
            git push
          fi

      # ---------------------------------------------------------
      # STATUS HANDLING STEPS
      # ---------------------------------------------------------

      # CASE 1: SUCCESS - Rename to " - Success" and Close
      - name: Handle Success
        if: success()
        uses: actions/github-script@v6
        with:
          script: |
            const originalTitle = context.payload.issue.title;
            const newTitle = `${originalTitle} - Success`;
            
            // 1. Rename Issue
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              title: newTitle,
              state: 'closed',
              state_reason: 'completed'
            });

            // 2. Add Comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ **Success!** Video downloaded and issue closed.'
            });

      # CASE 2: FAILURE - Rename to " - Failed" and Keep Open
      - name: Handle Failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            const originalTitle = context.payload.issue.title;
            const newTitle = `${originalTitle} - Failed`;
            
            // 1. Rename Issue (Keep state open)
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              title: newTitle
            });

            // 2. Add Error Comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '❌ **Failed.** The runner encountered an error. Check the Actions logs for details.'
            });
