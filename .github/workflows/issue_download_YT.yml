name: Download Video from Issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  download_on_runner:
    if: startsWith(github.event.issue.title, 'Download')
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Venv and Install Tools
        run: |
          if [ ! -d "venv" ]; then
            python3 -m venv venv
          fi
          ./venv/bin/pip install --upgrade pip
          ./venv/bin/pip install yt-dlp

      - name: Parse and Download
        env:
          # Use a Heredoc to safely capture the body regardless of special characters
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          cat << 'EOF' > issue_data.txt
          ${{ github.event.issue.body }}
          EOF
          echo "Running download script..."
          ./venv/bin/python download_video.py issue_data.txt

      - name: Commit and Push Video & Metadata
        run: |
          git config user.name "Self-Hosted Runner"
          git config user.email "runner@local"
          # Ensure directories exist so git add doesn't fail
          mkdir -p videos metadata
          git add videos/ metadata/
          if git diff-index --quiet HEAD; then
            echo "No changes to commit"
          else
            git commit -m "Add video & metadata from Issue #${{ github.event.issue.number }}"
            git push
          fi

      # ---------------------------------------------------------
      # RELEASE STEPS (Updated for Zapier Access)
      # ---------------------------------------------------------
      
      - name: Read Metadata
        if: success()
        run: |
          # 1. Read Video ID
          VIDEO_ID=$(cat video_id.txt | xargs)
          echo "VIDEO_ID=$VIDEO_ID" >> $GITHUB_ENV
          
          # 2. Read Video Title
          VIDEO_TITLE=$(cat video_title.txt | xargs)
          echo "VIDEO_TITLE=$VIDEO_TITLE" >> $GITHUB_ENV

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          ## VIDEO ID: Accessible in Zapier as "Tag Name"
          tag_name: ${{ env.VIDEO_ID }}

          ## VIDEO TITLE: Accessible in Zapier as "Name" (Added for you)
          name: ${{ env.VIDEO_TITLE }}
          files: videos/${{ env.VIDEO_ID }}.mp4

          ## VIDEO DESCRIPTION: Accessible in Zapier as "Body"
          body_path: release_body.txt

      # ---------------------------------------------------------
      # STATUS HANDLING
      # ---------------------------------------------------------

      - name: Handle Success
        if: success()
        uses: actions/github-script@v6
        with:
          script: |
            const originalTitle = context.payload.issue.title;
            const newTitle = originalTitle.includes("Success") ? originalTitle : `${originalTitle} - Success`;
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              title: newTitle,
              state: 'closed',
              state_reason: 'completed'
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ **Success!** Video metadata sent to Zapier.'
            });

      - name: Handle Failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            const originalTitle = context.payload.issue.title;
            const newTitle = originalTitle.includes("Failed") ? originalTitle : `${originalTitle} - Failed`;
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              title: newTitle
            });
