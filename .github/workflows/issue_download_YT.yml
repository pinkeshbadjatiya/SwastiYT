name: Download Video from Issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  download_on_runner:
    if: startsWith(github.event.issue.title, 'Download')
    runs-on: self-hosted
    # environment: secure-runner
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Venv and Install Tools
        run: |
          if [ ! -d "venv" ]; then
            python3 -m venv venv
          fi
          ./venv/bin/pip install --upgrade pip
          ./venv/bin/pip install yt-dlp

      - name: Parse and Download
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          echo "$ISSUE_BODY" > issue_data.txt
          echo "Running download script..."
          ./venv/bin/python download_video.py issue_data.txt

      - name: Commit and Push Video & Metadata
        run: |
          git config user.name "Self-Hosted Runner"
          git config user.email "runner@local"
          
          git add videos/ metadata/
          
          if git diff-index --quiet HEAD; then
            echo "No changes to commit"
          else
            git commit -m "Add video & metadata from Issue #${{ github.event.issue.number }}"
            git push
          fi

      # ---------------------------------------------------------
      # RELEASE STEPS
      # ---------------------------------------------------------
      
      # Step 1: Read the Video ID from the file created by Python
      - name: Read Video ID
        if: success()
        run: |
          # Read the ID from the file generated by download_video.py
          VIDEO_ID=$(cat video_id.txt | xargs)
          echo "Found Video ID: $VIDEO_ID"
          echo "VIDEO_ID=$VIDEO_ID" >> $GITHUB_ENV

      # Step 2: Create Release with Caption as Body
      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: video-${{ env.VIDEO_ID }}
          name: https://github.com/pinkeshbadjatiya/SwastiYT/blob/main/videos/${{ env.VIDEO_ID }}.mp4
          files: videos/${{ env.VIDEO_ID }}.mp4
          
          # This pulls the content (Title + Desc) from the file
          body_path: release_body.txt

      # ---------------------------------------------------------
      # STATUS HANDLING
      # ---------------------------------------------------------

      - name: Handle Success
        if: success()
        uses: actions/github-script@v6
        with:
          script: |
            const originalTitle = context.payload.issue.title;
            const newTitle = originalTitle.includes("Success") ? originalTitle : `${originalTitle} - Success`;
            
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              title: newTitle,
              state: 'closed',
              state_reason: 'completed'
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ **Success!** Video downloaded, Release created with Instagram caption.'
            });

      - name: Handle Failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            const originalTitle = context.payload.issue.title;
            const newTitle = originalTitle.includes("Failed") ? originalTitle : `${originalTitle} - Failed`;
            
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              title: newTitle
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '❌ **Failed.** Check runner logs for details.'
            });
