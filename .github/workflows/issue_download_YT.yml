name: Download Video from Issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  download_on_runner:
    if: startsWith(github.event.issue.title, 'Download ')
    runs-on: self-hosted
    # environment: secure-runner
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # STEP REMOVED: actions/setup-python (Not compatible with Ubuntu 25.10)
      
      # 1. Install System Dependencies (ffmpeg) and Python venv
      # We use -y to automatically say "yes" to prompts
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-venv

      # 2. Create Virtual Environment & Install yt-dlp
      # This bypasses the "externally-managed-environment" error on new Ubuntu
      - name: Setup Venv and Install Tools
        run: |
          # Create a virtual environment named 'venv'
          python3 -m venv venv
          
          # Upgrade pip inside the venv
          ./venv/bin/pip install --upgrade pip
          
          # Install yt-dlp inside the venv
          ./venv/bin/pip install yt-dlp

      - name: Validate and Download
        run: |
          ISSUE_TITLE="${{ github.event.issue.title }}"
          VIDEO_ID=$(echo "${ISSUE_TITLE#"Download "}" | xargs)
          
          # Security: Regex Check (Must be exactly 11 chars)
          if [[ ! "$VIDEO_ID" =~ ^[a-zA-Z0-9_-]{11}$ ]]; then
            echo "::error::Security Alert: Invalid Video ID format: $VIDEO_ID"
            exit 1
          fi
          
          VIDEO_URL="https://www.youtube.com/watch?v=${VIDEO_ID}"
          echo "Security Check Passed. Downloading: $VIDEO_ID"
          
          # CRITICAL: We run python using the VENV executable
          ./venv/bin/python download_video.py "$VIDEO_URL"

      - name: Commit and Push Video
        run: |
          git config user.name "Self-Hosted Runner"
          git config user.email "runner@local"
          
          git add videos/
          
          if git diff-index --quiet HEAD; then
            echo "No changes to commit"
          else
            git commit -m "Add video from Issue #${{ github.event.issue.number }}"
            git push
          fi

      - name: Close Issue
        uses: peter-evans/close-issue@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          comment: "Download complete! Processed securely on self-hosted runner."
