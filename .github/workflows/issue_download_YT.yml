name: Download Video from Issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  download_on_runner:
    if: startsWith(github.event.issue.title, 'Download ')

    # RUN ON YOUR MACHINE
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # Note: On a self-hosted runner, you usually install dependencies once manually.
      # But we keep this here to ensure updates are caught.
      - name: Install Dependencies
        run: |
          pip install yt-dlp

      - name: Validate and Download
        run: |
          ISSUE_TITLE="${{ github.event.issue.title }}"
          
          # Strip prefix
          VIDEO_ID=$(echo "${ISSUE_TITLE#"Download "}" | xargs)
          
          # --- SECURITY STEP: STRICT INPUT VALIDATION ---
          # We use Regex to ensure the ID is EXACTLY 11 characters (letters, numbers, _, -)
          # This prevents anyone from injecting commands like "; rm -rf /"
          if [[ ! "$VIDEO_ID" =~ ^[a-zA-Z0-9_-]{11}$ ]]; then
            echo "::error::Security Alert: Invalid Video ID format detected: $VIDEO_ID"
            exit 1
          fi
          # ----------------------------------------------
          
          VIDEO_URL="https://www.youtube.com/watch?v=${VIDEO_ID}"
          
          echo "Security Check Passed. Downloading: $VIDEO_ID"
          python download_video.py "$VIDEO_URL"

      - name: Commit and Push Video
        run: |
          # Since this is your own machine, git might already be configured, 
          # but we set local config just for this action to be safe.
          git config user.name "Self-Hosted Runner"
          git config user.email "runner@local"
          
          git add videos/
          
          if git diff-index --quiet HEAD; then
            echo "No changes to commit"
          else
            git commit -m "Add video from Issue #${{ github.event.issue.number }}"
            # We use the GITHUB_TOKEN to push, so we don't need your personal SSH keys
            git push
          fi

      - name: Close Issue
        uses: peter-evans/close-issue@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          comment: "Download complete! Processed securely on self-hosted runner."
