name: Download Video from Issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  download_on_runner:
    if: startsWith(github.event.issue.title, 'Download')
    runs-on: self-hosted
    # environment: secure-runner
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Venv and Install Tools
        run: |
          if [ ! -d "venv" ]; then
            python3 -m venv venv
          fi
          ./venv/bin/pip install --upgrade pip
          ./venv/bin/pip install yt-dlp

      - name: Parse and Download
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          # Save issue body to file for the python script
          echo "$ISSUE_BODY" > issue_data.txt
          
          echo "Running download script..."
          ./venv/bin/python download_video.py issue_data.txt

      - name: Commit and Push Video & Metadata
        run: |
          git config user.name "Self-Hosted Runner"
          git config user.email "runner@local"
          
          # Add both folders
          git add videos/ metadata/
          
          if git diff-index --quiet HEAD; then
            echo "No changes to commit"
          else
            git commit -m "Add video & metadata from Issue #${{ github.event.issue.number }}"
            git push
          fi

      # ---------------------------------------------------------
      # NEW STEP: CREATE RELEASE
      # ---------------------------------------------------------
      - name: Create Release
        if: success()
        # We need the ID for the URL, so we extract it from the issue data file
        run: |
          # Extract ID using grep (Find the line after "#### id ####")
          VIDEO_ID=$(grep -A 1 "#### id ####" issue_data.txt | tail -n 1 | xargs)
          echo "Detected Video ID: $VIDEO_ID"
          
          # Construct the exact URL required
          RELEASE_NAME="https://github.com/pinkeshbadjatiya/SwastiYT/blob/main/videos/${VIDEO_ID}.mp4"
          
          # Use the 'gh' cli (which is installed on the runner via actions/checkout or usually available)
          # OR use the standard action (Recommended for stability)
          
        # We use a specific action to make release creation easier
        uses: softprops/action-gh-release@v1
        with:
          # Unique tag for the release
          tag_name: video-${{ github.event.issue.number }}
          
          # The Name is the EXACT URL as requested
          name: https://github.com/pinkeshbadjatiya/SwastiYT/blob/main/videos/${{ env.VIDEO_ID }}.mp4
          
          # We attach the video file so it is downloadable from the release
          files: videos/*.mp4
          
          # Note: We need to dynamically set the name/file in a way that captures the ID.
          # Since 'with' doesn't support shell commands easily, we do a pre-step to set ENV vars.

      # REVISED RELEASE LOGIC (Cleaner implementation)
      - name: Prepare and Create Release
        if: success()
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # We use the issue number for the tag to ensure uniqueness per request
          tag_name: video-${{ github.event.issue.number }}
          # We use dynamic variable substitution for the ID
          # Note: Since we can't easily grep inside the 'with' block, we rely on the file matching
          files: videos/*.mp4 
          
      # ---------------------------------------------------------
      # CORRECTED RELEASE STEP WITH ID EXTRACTION
      # ---------------------------------------------------------
      - name: Extract ID and Publish Release
        if: success()
        run: |
          # 1. Extract ID
          VIDEO_ID=$(grep -A 1 "#### id ####" issue_data.txt | tail -n 1 | xargs)
          
          # 2. Define Release URL
          RELEASE_URL="https://github.com/pinkeshbadjatiya/SwastiYT/blob/main/videos/${VIDEO_ID}.mp4"
          
          echo "Creating release with name: $RELEASE_URL"
          
          # 3. Create Release using GitHub CLI (Pre-installed on most runners)
          # If gh cli is not on your self-hosted runner, install it or use the softprops action above.
          # Assuming you installed gh in setup-runner.sh or it came with the runner image.
          
          # Since 'gh' might be missing on custom self-hosted, let's use the 'softprops' action 
          # but pass the ID via GITHUB_ENV to make it accessible.
          echo "VIDEO_ID=$VIDEO_ID" >> $GITHUB_ENV

      - name: Finalize Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: video-${{ env.VIDEO_ID }}
          # The exact name you asked for:
          name: https://github.com/pinkeshbadjatiya/SwastiYT/blob/main/videos/${{ env.VIDEO_ID }}.mp4
          files: videos/${{ env.VIDEO_ID }}.mp4
          body: "Auto-generated release for ID: ${{ env.VIDEO_ID }}"


      # ---------------------------------------------------------
      # STATUS HANDLING STEPS
      # ---------------------------------------------------------

      - name: Handle Success
        if: success()
        uses: actions/github-script@v6
        with:
          script: |
            const originalTitle = context.payload.issue.title;
            const newTitle = originalTitle.includes("Success") ? originalTitle : `${originalTitle} - Success`;
            
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              title: newTitle,
              state: 'closed',
              state_reason: 'completed'
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ **Success!** Video downloaded, pushed to repo, and Release created.'
            });

      - name: Handle Failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            const originalTitle = context.payload.issue.title;
            const newTitle = originalTitle.includes("Failed") ? originalTitle : `${originalTitle} - Failed`;
            
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              title: newTitle
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '❌ **Failed.** Check runner logs for details.'
            });
