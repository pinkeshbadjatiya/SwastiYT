name: Download Video from Issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  download_on_runner:
    if: startsWith(github.event.issue.title, 'Download ')
    runs-on: self-hosted
    # environment: secure-runner
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 1. Setup Virtual Environment (No sudo needed)
      - name: Setup Venv and Install Tools
        run: |
          # Create venv if it doesn't exist to save time
          if [ ! -d "venv" ]; then
            python3 -m venv venv
          fi
          
          # Upgrade pip and install yt-dlp inside venv
          ./venv/bin/pip install --upgrade pip
          ./venv/bin/pip install yt-dlp

      # 2. Run the Download Script
      - name: Validate and Download
        run: |
          ISSUE_TITLE="${{ github.event.issue.title }}"
          VIDEO_ID=$(echo "${ISSUE_TITLE#"Download "}" | xargs)
          
          # Security Check
          if [[ ! "$VIDEO_ID" =~ ^[a-zA-Z0-9_-]{11}$ ]]; then
            echo "::error::Security Alert: Invalid Video ID format: $VIDEO_ID"
            exit 1
          fi
          
          VIDEO_URL="https://www.youtube.com/watch?v=${VIDEO_ID}"
          echo "Security Check Passed. Downloading: $VIDEO_ID"
          
          # Run using venv python
          ./venv/bin/python download_video.py "$VIDEO_URL"

      # 3. Commit and Push
      - name: Commit and Push Video
        run: |
          git config user.name "Self-Hosted Runner"
          git config user.email "runner@local"
          
          git add videos/
          
          if git diff-index --quiet HEAD; then
            echo "No changes to commit"
          else
            git commit -m "Add video from Issue #${{ github.event.issue.number }}"
            git push
          fi

      # 4. Close Issue (Using Native GitHub Script - No external tools needed)
      - name: Close Issue
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ **Download Complete!**\n\nThe video has been processed securely by the self-hosted runner and pushed to the repository.'
            });
