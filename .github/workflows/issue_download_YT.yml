name: Download Video from Issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  download_on_runner:
    if: startsWith(github.event.issue.title, 'Download')
    runs-on: self-hosted
    # environment: secure-runner
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Venv and Install Tools
        run: |
          if [ ! -d "venv" ]; then
            python3 -m venv venv
          fi
          ./venv/bin/pip install --upgrade pip
          ./venv/bin/pip install yt-dlp

      - name: Parse and Download
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          # Save issue body to file for the python script
          echo "$ISSUE_BODY" > issue_data.txt
          
          echo "Running download script..."
          ./venv/bin/python download_video.py issue_data.txt

      - name: Commit and Push Video & Metadata
        run: |
          git config user.name "Self-Hosted Runner"
          git config user.email "runner@local"
          
          # Add both folders
          git add videos/ metadata/
          
          if git diff-index --quiet HEAD; then
            echo "No changes to commit"
          else
            git commit -m "Add video & metadata from Issue #${{ github.event.issue.number }}"
            git push
          fi

      # ---------------------------------------------------------
      # FIXED RELEASE STEPS
      # ---------------------------------------------------------
      
      # Step 1: Extract ID and save it to GITHUB_ENV so next step can see it
      - name: Extract Video ID
        if: success()
        run: |
          # Grep the ID from the file we parsed earlier
          VIDEO_ID=$(grep -A 1 "#### id ####" issue_data.txt | tail -n 1 | xargs)
          
          echo "Found Video ID: $VIDEO_ID"
          
          # Write to GITHUB_ENV to make it available to the next step
          echo "VIDEO_ID=$VIDEO_ID" >> $GITHUB_ENV

      # Step 2: Create the Release using the ID variable
      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: video-${{ env.VIDEO_ID }}
          # The exact name you requested
          name: https://github.com/pinkeshbadjatiya/SwastiYT/blob/main/videos/${{ env.VIDEO_ID }}.mp4
          files: videos/${{ env.VIDEO_ID }}.mp4
          body: "Auto-generated release for Video ID: ${{ env.VIDEO_ID }}"

      # ---------------------------------------------------------
      # STATUS HANDLING STEPS
      # ---------------------------------------------------------

      - name: Handle Success
        if: success()
        uses: actions/github-script@v6
        with:
          script: |
            const originalTitle = context.payload.issue.title;
            const newTitle = originalTitle.includes("Success") ? originalTitle : `${originalTitle} - Success`;
            
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              title: newTitle,
              state: 'closed',
              state_reason: 'completed'
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ **Success!** Video downloaded, pushed to repo, and Release created.'
            });

      - name: Handle Failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            const originalTitle = context.payload.issue.title;
            const newTitle = originalTitle.includes("Failed") ? originalTitle : `${originalTitle} - Failed`;
            
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              title: newTitle
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '❌ **Failed.** Check runner logs for details.'
            });
