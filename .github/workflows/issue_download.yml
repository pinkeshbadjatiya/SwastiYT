name: Download Video from Issue

on:
  issues:
    types: [opened]

# Permissions required to push code and close issues
permissions:
  contents: write
  issues: write

jobs:
  download_from_issue:
    # Only run if the issue title starts with "Download "
    if: startsWith(github.event.issue.title, 'Download ')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # CHANGED: Installing yt-dlp instead of youtube-dl
      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Parse Issue Title and Run Script
        run: |
          # 1. Get the issue title
          ISSUE_TITLE="${{ github.event.issue.title }}"
          
          # 2. Extract ID (Remove "Download " prefix)
          VIDEO_ID=$(echo "${ISSUE_TITLE#"Download "}" | xargs)
          
          # 3. Construct URL
          VIDEO_URL="https://www.youtube.com/watch?v=${VIDEO_ID}"
          
          echo "Processing Issue #${{ github.event.issue.number }}"
          echo "Extracted ID: $VIDEO_ID"
          
          # 4. Run the script
          python download_video.py "$VIDEO_URL"

      - name: Commit and Push Video
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # Add the videos folder
          git add videos/
          
          # Commit only if there are changes
          if git diff-index --quiet HEAD; then
            echo "No changes to commit"
          else
            git commit -m "Add video from Issue #${{ github.event.issue.number }}"
            git push
          fi

      - name: Close Issue
        uses: peter-evans/close-issue@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          comment: "Download complete! The video has been committed to the 'videos' folder in the repository."
