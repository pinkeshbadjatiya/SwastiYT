# GitHub Actions Workflow: YT Video Download [Issue]
#
# DESCRIPTION:
# This workflow automatically downloads YouTube videos when a new issue is opened with a title starting with "Download".
# It parses the issue title to extract the video ID or URL, downloads the video from YouTube,
# extracts metadata (title, description, subtitles, thumbnails), and commits everything back to the repository.
#
# TRIGGER: An issue is opened (e.g., "Download eI2XD9pJ_QM" or "Download https://www.youtube.com/watch?v=VIDEO_ID")
# RUNNER: Self-hosted runner (requires yt-dlp to be available)
# OUTPUT:
#   - Downloaded video files in /videos/{video_id}/
#   - Metadata in /metadata/{video_id}/{lang}.json
#   - Helper files: video_id.txt, video_title.txt, video_description.txt, release_body.txt

name: YT Single Video Download [Issue]

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  download_on_runner:
    if: startsWith(github.event.issue.title, 'Download single-video')
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # - name: Install ffmpeg
      #   run: |
      #     sudo apt update
      #     sudo apt install -y ffmpeg

      - name: Setup Venv and Install Tools
        run: |
          if [ ! -d "venv" ]; then
            python3 -m venv venv
          fi
          ./venv/bin/pip install --upgrade pip
          ./venv/bin/pip install -r requirements.txt

      - name: Parse issue title and export video ID
        run: |
          ISSUE_TITLE='${{ github.event.issue.title }}'

          if [[ "$ISSUE_TITLE" =~ ^Download\ single-video\ (.+)$ ]]; then
            VIDEO_ID="${BASH_REMATCH[1]}"
            echo "VIDEO_ID=$VIDEO_ID" >> $GITHUB_ENV
          fi

      - name: Download single video
        run: |
          ./venv/bin/python src/download_video.py --task=single_video --video_id="$VIDEO_ID"

      - name: Commit and Push Video & Metadata
        run: |
          git config user.name "Self-Hosted Runner"
          git config user.email "runner@local"

          # Create folders if missing to prevent git errors
          mkdir -p videos metadata

          git add videos/ metadata/

          # Check if there are changes before committing to avoid empty commit errors
          if git diff-index --quiet HEAD; then
            echo "No changes to commit"
          else
            git commit -m "Add video & metadata from Issue #${{ github.event.issue.number }}"
            git push
          fi

      # ---------------------------------------------------------
      # STATUS HANDLING (Issue Updates)
      # ---------------------------------------------------------

      - name: Handle Success
        if: success()
        uses: actions/github-script@v6
        with:
          script: |
            const originalTitle = context.payload.issue.title;
            const newTitle = originalTitle.includes("Success") ? originalTitle : `${originalTitle} - Success`;

            // Add success comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: '✅ **Success!** Video downloaded. Ready for release.'
            });

            // Close the issue
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              state: 'closed',
              state_reason: 'completed'
            })

      - name: Handle Failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            const originalTitle = context.payload.issue.title;
            const newTitle = originalTitle.includes("Failed") ? originalTitle : `${originalTitle} - Failed`;

            // Rename issue to indicate failure (keeps it open for debugging)
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              title: newTitle
            });
