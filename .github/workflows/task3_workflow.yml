name: Translate Metadata Workflow

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *" # Runs every hour

jobs:
  translate_metadata_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Check for Pending Translate Metadata Task
        run: |
          # Read pending.json
          pending_json=$(cat tasks/pending.json)

          # Iterate over each video in pending.json
          for video_id in $(echo "$pending_json" | jq -r 'keys[]'); do
            download_video_status=$(echo "$pending_json" | jq -r ".$video_id.download_video")
            translate_metadata_status=$(echo "$pending_json" | jq -r ".$video_id.translate_metadata")
            
            if [ "$download_video_status" = "completed" ] && [ "$translate_metadata_status" = "pending" ]; then
              # Perform Translate Metadata logic here
              echo "Performing Translate Metadata for $video_id"
              
              # Update translate_metadata status to completed
              echo "$pending_json" | jq ".$video_id.translate_metadata = \"completed\"" > tasks/pending.json
              
              echo "Updated translate_metadata status for $video_id to completed"
            fi
          done
