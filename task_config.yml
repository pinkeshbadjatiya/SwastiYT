name: Task Configuration

description: Define task keys and their dependencies for workflows.

# Task Definitions
tasks:
  - key: "download_video"
    description: "Download the video and its metadata."
    dependencies: []

  - key: "transcribe_audio"
    description: "Transcribe the audio tracks of the video."
    dependencies: ["download_video"]

  - key: "translate_metadata"
    description: "Translate the video title and description into multiple languages."
    dependencies: ["download_video"]

  - key: "generate_subtitles"
    description: "Generate subtitles for the video in multiple languages."
    dependencies: ["transcribe_audio", "translate_metadata"]

  - key: "publish_video"
    description: "Publish the video and its associated files."
    dependencies: ["generate_subtitles"]
