<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwastiYT Hub | OmniChannel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bs-body-bg: #010409;
            --surface: #0d1117;
            --card-cap: #161b22;
            --accent: #238636;
            --border-color: #30363d;
            --text-secondary: #8b949e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            color: #c9d1d9;
        }

        /* Modern Card & Table UI */
        .card {
            background-color: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .table thead th {
            background-color: var(--card-cap);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
            border: none;
            padding: 1rem;
        }

        .table td {
            padding: 1.2rem 1rem;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        /* Thumbnail Effects */
        .thumbnail-mini { 
            width: 100px; 
            border-radius: 8px; 
            aspect-ratio: 16/9;
            object-fit: cover;
            transition: all 0.2s ease;
            cursor: pointer;
            border: 1px solid var(--border-color);
        }

        .thumbnail-mini:hover {
            transform: scale(1.05);
            border-color: #58a6ff;
            box-shadow: 0 0 15px rgba(88, 166, 255, 0.2);
        }

        /* Modern Buttons */
        .btn-github {
            background-color: var(--accent);
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-github:hover:not(:disabled) {
            background-color: #2ea44f;
            transform: translateY(-1px);
        }

        .form-control {
            background-color: var(--bs-body-bg);
            border: 1px solid var(--border-color);
            color: white !important;
        }

        .form-control:focus {
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }

        .status-pill { font-size: 0.7rem; font-weight: 600; padding: 0.4em 0.8em; border-radius: 20px; }
        
        @media (max-width: 768px) { .hide-mobile { display: none; } }
    </style>
</head>
<body>

<nav class="navbar border-bottom border-secondary-subtle py-3">
    <div class="container">
        <div class="d-flex align-items-center">
            <div class="bg-success rounded-circle me-2" style="width:10px; height:10px; box-shadow: 0 0 10px var(--accent)"></div>
            <span class="navbar-brand fw-bold m-0">SwastiYT <span class="text-secondary fw-light">Hub</span></span>
        </div>
        <div class="d-flex gap-2">
            <button id="theme-toggle" class="btn btn-link text-decoration-none p-0 me-2">🌓</button>
            <button id="refresh-btn" class="btn btn-outline-secondary btn-sm rounded-pill px-3">Refresh Sync</button>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row g-3 mb-4 align-items-end">
        <div class="col-md-8">
            <label class="form-label small text-secondary">Filter Library</label>
            <input type="text" id="table-search" class="form-control" placeholder="Search title, ID, or description...">
        </div>
        <div class="col-md-4">
            <div class="card p-2 px-3 text-center">
                <span class="small text-secondary text-uppercase" style="font-size: 0.65rem;">Social Distribution</span>
                <span id="social-count" class="h5 m-0 fw-bold text-success">--</span>
            </div>
        </div>
    </div>

    <div class="card border-0">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>Video</th>
                        <th>Content info</th>
                        <th class="hide-mobile">Date</th>
                        <th>Status</th>
                        <th class="text-end">Action</th>
                    </tr>
                </thead>
                <tbody id="tracker-body">
                    <tr><td colspan="5" class="text-center py-5"><div class="spinner-border text-primary"></div></td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="previewModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-secondary bg-dark">
            <div class="modal-header border-secondary">
                <h6 class="modal-title fw-bold" id="modalTitle"></h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-5">
                        <img id="modalImg" src="" class="img-fluid rounded border border-secondary shadow mb-3">
                        <div id="modalMeta" class="small text-secondary p-2 rounded bg-black"></div>
                    </div>
                    <div class="col-md-7">
                        <div id="modalDesc" class="small lh-base" style="white-space: pre-wrap; height: 320px; overflow-y: auto; color: #8b949e;"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer border-secondary">
                <button id="modalActionBtn" class="btn btn-github w-100 py-2">Push to Social Media</button>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // --- Configuration & Security ---
    const GH_OWNER = 'pinkeshbadjatiya';
    const GH_REPO  = 'SwastiYT';

    const _p1 = 'Z2l0aHViX3BhdF8xMUFEUktTR0Ewenc4bEZQM3';
    const _p2 = 'RvTWhZX2UzeUcxdmJvRFdiQUh2Vmg3VmhNeHdl';
    const _p3 = 'QWEyZTRtUXJMa2J4U2VhWlk0MEFTSDU0VUJSTEMxOG5tSklJ';

    const getAuth = () => atob([_p1, _p2, _p3].join(''));

    let allData = [];

    $(document).ready(function() {
        refreshAll();

        $('#refresh-btn').on('click', refreshAll);
        $('#theme-toggle').on('click', () => {
            const theme = $('html').attr('data-bs-theme') === 'dark' ? 'light' : 'dark';
            $('html').attr('data-bs-theme', theme);
        });

        $('#table-search').on('keyup', function() {
            const val = $(this).val().toLowerCase();
            $("#tracker-body tr").filter(function() {
                $(this).toggle($(this).text().toLowerCase().indexOf(val) > -1);
            });
        });
    });

    function refreshAll() {
        const headers = { 'Authorization': `token ${getAuth()}` };
        $('#tracker-body').html('<tr><td colspan="5" class="text-center py-5"><div class="spinner-border text-primary"></div></td></tr>');

        $.when(
            $.ajax({ url: `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/metadata`, headers }),
            $.ajax({ url: `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/releases`, headers })
        ).done(function(metaData, releaseData) {
            const releases = releaseData[0];
            const postedIds = releases.map(r => r.tag_name);
            allData = [];

            const fetchPromises = metaData[0].filter(f => f.name.endsWith('.json')).map(file => {
                return $.getJSON(file.download_url).then(data => {
                    data.isPosted = postedIds.includes(data.id);
                    allData.push(data);
                });
            });

            Promise.all(fetchPromises).then(() => {
                allData.sort((a,b) => new Date(b.published_date) - new Date(a.published_date));
                renderTable();
                $('#social-count').text(`${allData.filter(d=>d.isPosted).length} / ${allData.length}`);
            });
        }).fail(() => {
            $('#tracker-body').html('<tr><td colspan="5" class="text-center text-danger">Unauthorized: Check Token configuration.</td></tr>');
        });
    }

    function renderTable() {
        const rows = allData.map(data => `
            <tr>
                <td><img src="${data.thumbnail}" class="thumbnail-mini preview-trigger" data-id="${data.id}"></td>
                <td>
                    <div class="fw-bold text-white text-truncate" style="max-width: 320px;">${data.title}</div>
                    <div class="small text-secondary">${data.id}</div>
                </td>
                <td class="hide-mobile small text-secondary">${new Date(data.published_date).toLocaleDateString()}</td>
                <td>
                    <span class="badge status-pill ${data.isPosted ? 'bg-success-subtle text-success border border-success' : 'bg-warning-subtle text-warning border border-warning'}">
                        ${data.isPosted ? 'PUBLISHED' : 'READY'}
                    </span>
                </td>
                <td class="text-end">
                    <button class="btn btn-sm ${data.isPosted ? 'btn-outline-secondary' : 'btn-github'} action-btn" 
                            data-id="${data.id}" ${data.isPosted ? 'disabled' : ''}>
                        ${data.isPosted ? 'Synced' : 'Deploy'}
                    </button>
                </td>
            </tr>
        `);
        $('#tracker-body').html(rows.join(''));
    }

    $(document).on('click', '.preview-trigger', function() {
        const video = allData.find(v => v.id === $(this).data('id'));
        $('#modalTitle').text(video.title);
        $('#modalImg').attr('src', video.thumbnail);
        $('#modalDesc').text(video.description);
        $('#modalMeta').html(`ID: ${video.id} | Date: ${new Date(video.published_date).toLocaleDateString()}`);
        
        const btn = $('#modalActionBtn');
        if (video.isPosted) btn.prop('disabled', true).text('Already Synced');
        else btn.prop('disabled', false).text('Push to Social Media').off('click').on('click', () => triggerPost(video.id, video.title));

        new bootstrap.Modal('#previewModal').show();
    });

    $(document).on('click', '.action-btn', function() {
        const video = allData.find(v => v.id === $(this).data('id'));
        triggerPost(video.id, video.title);
    });

    function triggerPost(id, title) {
        if (!confirm(`Deploy "${title}"?`)) return;
        $.ajax({
            url: `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/releases`,
            method: 'POST',
            headers: { 'Authorization': `token ${getAuth()}`, 'Content-Type': 'application/json' },
            data: JSON.stringify({ tag_name: id, name: title, body: `Automated Social Post` }),
            success: () => { alert("Deployment Started!"); refreshAll(); },
            error: () => alert("Deployment failed.")
        });
    }
</script>
</body>
</html>
