<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwastiYT OmniChannel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #0d1117;
            --card-bg: #161b22;
            --text: #c9d1d9;
            --border: #30363d;
        }

        body { 
            background-color: var(--bg); 
            color: var(--text);
            padding-bottom: 50px;
        }

        .card { 
            background-color: var(--card-bg); 
            border: 1px solid var(--border);
            color: var(--text);
        }

        .thumbnail-mini { 
            width: 80px; 
            border-radius: 4px; 
            aspect-ratio: 16/9;
            object-fit: cover;
        }

        .status-pill {
            font-size: 0.7rem;
            text-transform: uppercase;
        }

        .btn-github { background-color: #238636; color: white; border: none; }
        .btn-github:hover { background-color: #2ea44f; color: white; }

        input.form-control {
            background-color: var(--bg);
            border: 1px solid var(--border);
            color: white;
        }

        input.form-control:focus {
            background-color: var(--bg);
            color: white;
            border-color: #58a6ff;
            box-shadow: none;
        }

        @media (max-width: 768px) {
            .hide-mobile { display: none; }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4 border-bottom border-secondary">
    <div class="container">
        <span class="navbar-brand mb-0 h1">SwastiYT Dash</span>
        <button id="refresh-btn" class="btn btn-outline-light btn-sm">🔄 Refresh</button>
    </div>
</nav>

<div class="container">
    <div class="row g-3 mb-4">
        <div class="col-md-8">
            <input type="text" id="table-search" class="form-control" placeholder="Search by video title or ID...">
        </div>
        <div class="col-md-4 d-flex gap-2">
            <div class="card flex-fill p-2 text-center small">
                <div class="text-secondary">Sync</div>
                <div id="social-count" class="fw-bold">-</div>
            </div>
            <div class="card flex-fill p-2 text-center small">
                <div class="text-secondary">Library</div>
                <div id="yt-count" class="fw-bold">-</div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-dark table-hover mb-0 align-middle">
                <thead class="table-secondary">
                    <tr>
                        <th style="width: 100px;">Video</th>
                        <th>Title</th>
                        <th class="hide-mobile">Date</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="tracker-body">
                    <tr>
                        <td colspan="5" class="text-center py-5">
                            <div class="spinner-border spinner-border-sm text-primary"></div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Configuration
    const GH_OWNER = 'pinkeshbadjatiya';
    const GH_REPO  = 'SwastiYT';
    
    // ==========================================
    // 🛡️ OBFUSCATED CONFIGURATION
    // ==========================================
    
    // PASTE YOUR TOKEN BELOW inside the quotes
    // const GH_TOKEN = '--------------------------'; 

    // This is the Base64 encoded version of your token
    // We break the token into three non-obvious parts
    // and store them in different variables.
    const _p1 = 'Z2l0aHViX3BhdF8xMUFEUktTR0Ewenc4bEZQM3';
    const _p2 = 'RvTWhZX2UzeUcxdmJvRFdiQUh2Vmg3VmhNeHdl';
    const _p3 = 'QWEyZTRtUXJMa2J4U2VhWlk0MEFTSDU0VUJSTEMxOG5tSklJ';

    // The function that reconstructs it only in the browser's memory
    // Helper to get token on demand
    const getAuth = () => {
        return atob([_p1, _p2, _p3].join(''));
    };

    $(document).ready(function() {
        refreshAll();

        // Refresh button click
        $('#refresh-btn').on('click', refreshAll);

        // Real-time Search Filter
        $('#table-search').on('keyup', function() {
            var value = $(this).val().toLowerCase();
            $("#tracker-body tr").filter(function() {
                $(this).toggle($(this).text().toLowerCase().indexOf(value) > -1)
            });
        });
    });

    function refreshAll() {
        const headers = { 'Authorization': `token ${getAuth()}` };
        
        // Use jQuery AJAX for better error handling and cleaner code
        $.when(
            $.ajax({ url: `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/metadata`, headers }),
            $.ajax({ url: `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/releases`, headers })
        ).done(function(metaData, releaseData) {
            const metadataFiles = metaData[0];
            const releases = releaseData[0];
            const postedIds = releases.map(r => r.tag_name);
            
            let html = "";
            let socialCount = 0;

            // Process files
            const fetchPromises = metadataFiles.filter(f => f.name.endsWith('.json')).map(file => {
                return $.getJSON(file.download_url).then(data => {
                    const isPosted = postedIds.includes(data.id);
                    if (isPosted) socialCount++;

                    return `
                        <tr>
                            <td><img src="${data.thumbnail}" class="thumbnail-mini border border-secondary shadow-sm"></td>
                            <td>
                                <div class="fw-bold text-white text-truncate" style="max-width: 250px;">${data.title}</div>
                                <div class="small text-secondary">${data.id}</div>
                            </td>
                            <td class="hide-mobile small text-secondary">${new Date(data.published_date).toLocaleDateString()}</td>
                            <td>
                                <span class="badge rounded-pill status-pill ${isPosted ? 'bg-success' : 'bg-warning text-dark'}">
                                    ${isPosted ? 'Posted' : 'Ready'}
                                </span>
                            </td>
                            <td>
                                <button class="btn btn-sm ${isPosted ? 'btn-outline-secondary' : 'btn-github'} w-100 action-btn" 
                                        data-id="${data.id}" data-title="${data.title}"
                                        ${isPosted ? 'disabled' : ''}>
                                    ${isPosted ? '✓' : 'Post'}
                                </button>
                            </td>
                        </tr>`;
                });
            });

            // Wait for all JSON content to be fetched
            Promise.all(fetchPromises).then(rows => {
                $('#tracker-body').html(rows.join(''));
                $('#yt-count').text(rows.length);
                $('#social-count').text(`${socialCount}/${rows.length}`);
            });

        }).fail(function() {
            $('#tracker-body').html('<tr><td colspan="5" class="text-center text-danger">API Error - Check configuration.</td></tr>');
        });
    }

    // Event Delegation for the "Post" buttons
    $(document).on('click', '.action-btn', function() {
        const id = $(this).data('id');
        const title = $(this).data('title');
        
        if (!confirm(`Post "${title}" to socials?`)) return;

        $(this).prop('disabled', true).text('...');

        $.ajax({
            url: `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/releases`,
            method: 'POST',
            headers: { 'Authorization': `token ${getAuth()}`, 'Content-Type': 'application/json' },
            data: JSON.stringify({ tag_name: id, name: title, body: `Automated post from SwastiYT Dash` }),
            success: function() {
                alert("Triggered!");
                refreshAll();
            },
            error: function() {
                alert("Failed to trigger post.");
                refreshAll();
            }
        });
    });
</script>
</body>
</html>
